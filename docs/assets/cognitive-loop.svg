<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="flame-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="accent-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f97316"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  <g opacity="0.06">
    <path d="M 0 70 L 1200 70 M 0 140 L 1200 140 M 0 210 L 1200 210 M 0 280 L 1200 280 M 0 350 L 1200 350 M 0 420 L 1200 420 M 0 490 L 1200 490 M 0 560 L 1200 560 M 0 630 L 1200 630" stroke="#38bdf8" stroke-width="1"/>
    <path d="M 80 0 L 80 680 M 160 0 L 160 680 M 240 0 L 240 680 M 320 0 L 320 680 M 400 0 L 400 680 M 480 0 L 480 680 M 560 0 L 560 680 M 640 0 L 640 680 M 720 0 L 720 680 M 800 0 L 800 680 M 880 0 L 880 680 M 960 0 L 960 680 M 1040 0 L 1040 680 M 1120 0 L 1120 680" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Header Section -->
  <text x="600" y="45" text-anchor="middle" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="2">
    PADRÃO COGNITIVO DE TUNING SPARK (O-C-H-E-M-V-D-L)
  </text>
  <text x="600" y="70" text-anchor="middle" font-size="13" font-weight="400" fill="#94a3b8">
    Ciclo Autônomo com Early-Falsification Gate, Auditoria de Dados e Decisão Multi-Objetivo de Pareto
  </text>

  <!-- TOP TRACK: Forward Flow (O -> C -> H -> H-Gate -> E) -->

  <!-- Node O: OBSERVE -->
  <g transform="translate(60, 110)">
    <rect width="180" height="90" rx="12" fill="url(#card-grad-1)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="4" rx="2" fill="url(#accent-cyan)"/>
    <text x="16" y="28" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">1. OBSERVE</text>
    <text x="16" y="50" font-size="15" font-weight="700" fill="#ffffff">Telemetria &amp; Logs</text>
    <text x="16" y="70" font-size="11" fill="#94a3b8">Event Logs, DAG, GC, I/O</text>
  </g>

  <!-- Arrow O -> C -->
  <path d="M 240 155 L 285 155" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Node C: CLASSIFY -->
  <g transform="translate(295, 110)">
    <rect width="180" height="90" rx="12" fill="url(#card-grad-1)" stroke="#f97316" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="4" rx="2" fill="url(#flame-grad)"/>
    <text x="16" y="28" font-size="11" font-weight="700" fill="#f97316" letter-spacing="1">2. CLASSIFY</text>
    <text x="16" y="50" font-size="15" font-weight="700" fill="#ffffff">Diagnóstico Físico</text>
    <text x="16" y="70" font-size="11" fill="#94a3b8">Spill, Skew, GC ou Shuffle</text>
  </g>

  <!-- Arrow C -> H -->
  <path d="M 475 155 L 520 155" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Node H: HYPOTHESIZE -->
  <g transform="translate(530, 110)">
    <rect width="180" height="90" rx="12" fill="url(#card-grad-1)" stroke="#f97316" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="4" rx="2" fill="url(#flame-grad)"/>
    <text x="16" y="28" font-size="11" font-weight="700" fill="#f97316" letter-spacing="1">3. HYPOTHESIZE</text>
    <text x="16" y="50" font-size="15" font-weight="700" fill="#ffffff">Hipótese Ponderada</text>
    <text x="16" y="70" font-size="11" fill="#94a3b8">Mecanismo &amp; Prioritizer</text>
  </g>

  <!-- Arrow H -> H-Gate -->
  <path d="M 710 155 L 755 155" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Decision Node: H-GATE -->
  <g transform="translate(765, 110)">
    <polygon points="90,0 180,45 90,90 0,45" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
    <text x="90" y="40" text-anchor="middle" font-size="12" font-weight="800" fill="#eab308">H-GATE</text>
    <text x="90" y="56" text-anchor="middle" font-size="10" fill="#cbd5e1">Viabilidade?</text>
  </g>

  <!-- Arrow H-Gate -> Experiment (Yes) -->
  <path d="M 945 155 L 985 155" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="965" y="145" text-anchor="middle" font-size="10" font-weight="700" fill="#10b981">SIM</text>

  <!-- Node E: EXPERIMENT -->
  <g transform="translate(995, 110)">
    <rect width="145" height="90" rx="12" fill="url(#card-grad-1)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="145" height="4" rx="2" fill="url(#accent-green)"/>
    <text x="14" y="28" font-size="11" font-weight="700" fill="#10b981" letter-spacing="1">4. EXPERIMENT</text>
    <text x="14" y="50" font-size="14" font-weight="700" fill="#ffffff">Isolamento Atômico</text>
    <text x="14" y="70" font-size="10" fill="#94a3b8">Branch/Worktree</text>
  </g>

  <!-- Transition Arrow: E down to M -->
  <path d="M 1067 200 L 1067 265" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- BOTTOM TRACK: Return Flow (M -> V -> D -> PR Ready / Rollback) -->

  <!-- Node M: MEASURE -->
  <g transform="translate(975, 275)">
    <rect width="165" height="90" rx="12" fill="url(#card-grad-1)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="165" height="4" rx="2" fill="url(#accent-cyan)"/>
    <text x="14" y="28" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">5. MEASURE</text>
    <text x="14" y="50" font-size="15" font-weight="700" fill="#ffffff">FinOps &amp; Estatística</text>
    <text x="14" y="70" font-size="10" fill="#94a3b8">p50/p95/p99 &amp; Repetições</text>
  </g>

  <!-- Arrow M -> V -->
  <path d="M 975 320 L 920 320" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Node V: VERIFY -->
  <g transform="translate(730, 275)">
    <rect width="180" height="90" rx="12" fill="url(#card-grad-1)" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="4" rx="2" fill="url(#accent-cyan)"/>
    <text x="14" y="28" font-size="11" font-weight="700" fill="#06b6d4" letter-spacing="1">6. VERIFY</text>
    <text x="14" y="50" font-size="15" font-weight="700" fill="#ffffff">Quality Gate 100%</text>
    <text x="14" y="70" font-size="10" fill="#94a3b8">Row count, Checksum, Schema</text>
  </g>

  <!-- Arrow V -> D -->
  <path d="M 730 320 L 675 320" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Decision Node: DECIDE -->
  <g transform="translate(485, 275)">
    <polygon points="90,0 180,45 90,90 0,45" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="90" y="40" text-anchor="middle" font-size="12" font-weight="800" fill="#38bdf8">7. DECIDE</text>
    <text x="90" y="56" text-anchor="middle" font-size="10" fill="#cbd5e1">Fronteira Pareto?</text>
  </g>

  <!-- Arrow D -> PR Ready (Aprovado Dominante) -->
  <path d="M 485 320 L 415 320" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="450" y="310" text-anchor="middle" font-size="10" font-weight="700" fill="#10b981">DOMINANTE</text>

  <!-- Node: PR READY -->
  <g transform="translate(230, 275)">
    <rect width="175" height="90" rx="12" fill="url(#card-grad-1)" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="175" height="4" rx="2" fill="url(#accent-green)"/>
    <text x="14" y="28" font-size="11" font-weight="700" fill="#10b981" letter-spacing="1">PROMOÇÃO</text>
    <text x="14" y="50" font-size="15" font-weight="700" fill="#ffffff">PR Ready</text>
    <text x="14" y="70" font-size="10" fill="#94a3b8">Relatório &amp; Evidências</text>
  </g>

  <!-- Arrow D Down -> Rollback (Regressão / Falha) -->
  <path d="M 575 365 L 575 425 L 415 425" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="495" y="415" text-anchor="middle" font-size="10" font-weight="700" fill="#ef4444">REGRESSÃO / FALHA</text>

  <!-- Node: ROLLBACK -->
  <g transform="translate(230, 395)">
    <rect width="175" height="70" rx="12" fill="url(#card-grad-1)" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="0" y="0" width="175" height="4" rx="2" fill="url(#accent-red)"/>
    <text x="14" y="24" font-size="10" font-weight="700" fill="#ef4444" letter-spacing="1">SEGURANÇA</text>
    <text x="14" y="44" font-size="14" font-weight="700" fill="#ffffff">Rollback Atômico</text>
    <text x="14" y="60" font-size="10" fill="#94a3b8">Restaura Baseline</text>
  </g>

  <!-- LEARNING & MEMORY SECTION -->

  <!-- Connect PR Ready & Rollback to LEARN -->
  <path d="M 230 320 L 150 320 L 150 515" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <path d="M 230 430 L 150 430" fill="none" stroke="#ef4444" stroke-width="1.5"/>

  <!-- H-Gate rejection link to LEARN -->
  <path d="M 855 110 L 855 80 L 1170 80 L 1170 555 L 770 555" fill="none" stroke="#eab308" stroke-dasharray="4 4" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="1010" y="70" text-anchor="middle" font-size="10" font-weight="600" fill="#eab308">INVIÁVEL / REJEITADA PREVIAMENTE</text>

  <!-- Node 8: LEARN -->
  <g transform="translate(150, 515)">
    <rect width="610" height="85" rx="14" fill="url(#card-grad-1)" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="610" height="4" rx="2" fill="#a855f7"/>
    <text x="20" y="28" font-size="12" font-weight="700" fill="#c084fc" letter-spacing="1">8. LEARN &amp; EXPERIMENT REGISTRY</text>
    <text x="20" y="52" font-size="16" font-weight="700" fill="#ffffff">Catálogo de Memória e Aprendizado Ativo</text>
    <text x="20" y="72" font-size="12" fill="#cbd5e1">Indexa fingerprint do workload, armazena trade-offs e previne repetição de configurações falhas</text>
  </g>

  <!-- Loop back from LEARN to OBSERVE -->
  <path d="M 150 555 L 40 555 L 40 155 L 55 155" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-cyan)"/>
  <text x="30" y="340" text-anchor="middle" font-size="10" font-weight="700" fill="#c084fc" transform="rotate(-90 30 340)">PRÓXIMA ITERAÇÃO (O-C-H-E-M-V-D-L)</text>
</svg>
