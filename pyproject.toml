[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-tuning"
version = "0.1.0"
description = "Evidence-driven Spark performance engineering loop"
requires-python = ">=3.10"

[project.scripts]
spark-tuning = "spark_tuning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
