name: Skills validation & Deep Test Tree

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------------
  # Nível 1: Validação de Documentação, Contratos do Loop e Licença
  # -------------------------------------------------------------------------
  01-contracts:
    name: "01. Contratos & Documentação"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar integridade dos contratos e arquivos requeridos
        run: |
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md
          test -f templates/SKILL_TEMPLATE.md
          test -f templates/BENCHMARK_TEMPLATE.md
          test -f templates/DECISION_TEMPLATE.md
          test -f docs/engineering-loop.md
          test -f docs/cognitive-loop.md
          test -f scripts/validate_loop.sh
      - name: Validar sintaxe JSON e schemas
        run: |
          python3 -c "import json, glob; [json.load(open(p)) for p in glob.glob('**/*.json', recursive=True)]"
      - name: Executar validação de conformidade do loop
        run: bash scripts/validate_loop.sh

  # -------------------------------------------------------------------------
  # Nível 2: Testes Profundos das Camadas Unitárias por Domínio (Paralelos)
  # -------------------------------------------------------------------------
  02-core-domain:
    name: "02. Core: Modelos, Compatibilidade & Prioritizer"
    runs-on: ubuntu-latest
    needs: 01-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testar modelos de domínio, priorização e matriz de compatibilidade
        run: PYTHONPATH=src python3 -m unittest discover -s tests/unit/core -v

  03-diagnostics-gate:
    name: "03. Diagnostics & Quality Gate"
    runs-on: ubuntu-latest
    needs: 01-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testar classificação de gargalos (skew, spill, GC, shuffle) e DataQualityGate
        run: PYTHONPATH=src python3 -m unittest tests/unit/test_batch1_pillars.py -v

  04-safety-canary:
    name: "04. Safety, Rollback & Sanitização"
    runs-on: ubuntu-latest
    needs: 01-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testar allowlists de arquivos, rollback atômico, canary e sanitização de logs
        run: |
          PYTHONPATH=src python3 -m unittest tests/unit/test_batch3_pillars.py -v

  05-multi-agent:
    name: "05. Multi-Agent Specialization & FinOps Arbiter"
    runs-on: ubuntu-latest
    needs: [02-core-domain, 03-diagnostics-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testar agentes especialistas (Storage, Shuffle) e veto do FinOps Arbiter
        run: PYTHONPATH=src python3 -m unittest discover -s tests/unit/agents -v

  06-bayesian-search:
    name: "06. Otimização Bayesiana & Live Monitor"
    runs-on: ubuntu-latest
    needs: [02-core-domain, 04-safety-canary]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testar busca Bayesiana e Early-Abort em tempo real via Spark UI API
        run: PYTHONPATH=src python3 -m unittest tests/unit/test_advanced_skills_extension.py -v

  # -------------------------------------------------------------------------
  # Nível 3: Validação de Performance A/B e Benchmarks Multi-Tecnologia
  # -------------------------------------------------------------------------
  07-ab-benchmarks:
    name: "07. Harness A/B & Benchmarks Multi-Tecnologia"
    runs-on: ubuntu-latest
    needs: [05-multi-agent, 06-bayesian-search]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar saltos de performance (PySpark Arrow, Broadcast, ZSTD, Spill Zero)
        run: PYTHONPATH=src python3 -m unittest discover -s tests/unit/experimentation -v

  # -------------------------------------------------------------------------
  # Nível 4: Gate de Regressão e Verificação Integrada do Loop
  # -------------------------------------------------------------------------
  08-regression-gate:
    name: "08. Gate Final de Regressão & Decisão Pareto"
    runs-on: ubuntu-latest
    needs: 07-ab-benchmarks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Executar teste integrado do motor de loop de ponta a ponta
        run: PYTHONPATH=src python3 -m unittest tests/test_engine.py tests/test_event_log_runner.py -v
      - name: Validar políticas de decisão de Pareto
        run: |
          grep -q "accept" templates/DECISION_TEMPLATE.md
          grep -q "reject" templates/DECISION_TEMPLATE.md
          grep -q "inconclusive" templates/DECISION_TEMPLATE.md
          echo "Todos os gates da árvore de CI passaram com sucesso!"
