name: Skills validation & Deep Test Tree

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # =========================================================================
  # NÍVEL 1: RAIZ - CONTRATOS, DOCUMENTAÇÃO E METADADOS
  # =========================================================================
  gate_contracts:
    name: "01. [Raiz] Contratos & Licença"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar arquivos vitais
        run: |
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md
          test -f templates/SKILL_TEMPLATE.md
          test -f templates/BENCHMARK_TEMPLATE.md
          test -f templates/DECISION_TEMPLATE.md
          test -f docs/engineering-loop.md
          test -f docs/cognitive-loop.md
          test -f scripts/validate_loop.sh

  gate_schema:
    name: "02. [Raiz] Schemas JSON & Metadados"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse estrito de schemas JSON e YAML
        run: |
          python3 -c "import json, glob; [json.load(open(p)) for p in glob.glob('**/*.json', recursive=True)]"

  # =========================================================================
  # NÍVEL 2: CAMADAS DE DOMÍNIO BASE (Execução Concorrente ramificada)
  # =========================================================================
  core_domain:
    name: "03. [Ramo A] Core: Modelos, Specs & Prioritizer"
    runs-on: ubuntu-latest
    needs: [gate_contracts, gate_schema]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testar modelos de domínio, priorização e matriz de compatibilidade
        run: PYTHONPATH=src python3 -m unittest discover -s tests/unit/core -v

  diagnostics_engine:
    name: "04. [Ramo B] Diagnostics: Skew, Spill, GC & Shuffle"
    runs-on: ubuntu-latest
    needs: [gate_contracts, gate_schema]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testar motor determinístico de classificação de gargalos
        run: PYTHONPATH=src python3 -m unittest tests/unit/test_batch1_pillars.py -v

  safety_and_gates:
    name: "05. [Ramo C] Safety: Quality Gate, Canary & Rollback"
    runs-on: ubuntu-latest
    needs: [gate_contracts, gate_schema]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testar DataQualityGate, allowlist, atomic rollback e sanitização
        run: PYTHONPATH=src python3 -m unittest tests/unit/test_batch3_pillars.py -v

  # =========================================================================
  # NÍVEL 3: AGENTES ESPECIALISTAS E COGNIÇÃO AVANÇADA
  # =========================================================================
  multi_agent_network:
    name: "06. [Sub-ramo A1] Multi-Agent Network & FinOps Arbiter"
    runs-on: ubuntu-latest
    needs: [core_domain, diagnostics_engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testar deliberação entre Storage/Shuffle agents e veto do FinOps Arbiter
        run: PYTHONPATH=src python3 -m unittest discover -s tests/unit/agents -v

  bayesian_and_monitoring:
    name: "07. [Sub-ramo B1] Bayesian Optimizer & Live REST Monitor"
    runs-on: ubuntu-latest
    needs: [core_domain, safety_and_gates]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testar busca adaptativa Bayesiana e Early-Abort em tempo real
        run: PYTHONPATH=src python3 -m unittest tests/unit/test_advanced_skills_extension.py -v

  saas_daemon_and_knowledge:
    name: "08. [Sub-ramo C1] SaaS Scanner, Daemon & Cross-Repo Memory"
    runs-on: ubuntu-latest
    needs: [core_domain, safety_and_gates]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testar scanner multi-tenant, motor de conhecimento e daemon assíncrono
        run: PYTHONPATH=src python3 -m unittest tests/unit/test_product_saas_architecture.py -v

  # =========================================================================
  # NÍVEL 4: COMPROVAÇÃO DE PERFORMANCE EMPÍRICA (A/B e Anti-Patterns)
  # =========================================================================
  anti_pattern_healing:
    name: "09. [Avaliação 1] Detecção e Cura de Anti-Patterns Reais"
    runs-on: ubuntu-latest
    needs: [multi_agent_network, bayesian_and_monitoring]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Provar cura de jobs com Spill massivo e GC Thrashing
        run: PYTHONPATH=src python3 -m unittest discover -s tests/integration -v

  ab_benchmarks:
    name: "10. [Avaliação 2] Harness A/B & Benchmarks Multi-Tecnologia"
    runs-on: ubuntu-latest
    needs: [multi_agent_network, saas_daemon_and_knowledge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar saltos de performance (Arrow, Broadcast, ZSTD, Zero Spill)
        run: PYTHONPATH=src python3 -m unittest tests/unit/experimentation/test_multi_tech_benchmarks.py -v

  # =========================================================================
  # NÍVEL 5: CÚPULA DE REGRESSÃO, RELATÓRIO E DECISÃO DE PARETO
  # =========================================================================
  regression_gate:
    name: "11. [Cúpula] Gate Final de Regressão & Decisão Pareto"
    runs-on: ubuntu-latest
    needs: [anti_pattern_healing, ab_benchmarks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Executar teste integrado do motor de loop de ponta a ponta
        run: PYTHONPATH=src python3 -m unittest tests/test_engine.py tests/test_event_log_runner.py -v
      - name: Validar conformidade de decisão e critérios de release
        run: |
          grep -q "accept" templates/DECISION_TEMPLATE.md
          grep -q "reject" templates/DECISION_TEMPLATE.md
          grep -q "inconclusive" templates/DECISION_TEMPLATE.md
          bash scripts/validate_loop.sh
          echo "Árvore de CI/CD completa validada com sucesso em todos os 11 ramos!"
