name: Skills validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  contracts:
    name: 01 Documentation and Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate required files
        shell: bash
        run: |
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md
          test -f templates/SKILL_TEMPLATE.md
          test -f templates/BENCHMARK_TEMPLATE.md
          test -f templates/DECISION_TEMPLATE.md
          test -f skills/README.md
          test -f docs/engineering-loop.md
          test -f docs/pr-safety.md
          test -f docs/skill-lifecycle.md
          test -f templates/LOOP_RUN_TEMPLATE.md
          test -f scripts/validate_loop.sh
      - name: Validate loop contract
        run: bash scripts/validate_loop.sh

  schema:
    name: 02 Schema and metadata
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML and JSON when present
        shell: bash
        run: |
          json_files=()
          yaml_files=()
          while IFS= read -r -d '' path; do json_files+=("$path"); done < <(find . -type f -name '*.json' -print0)
          while IFS= read -r -d '' path; do yaml_files+=("$path"); done < <(find . -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)
          if [ "${#json_files[@]}" -gt 0 ]; then
            python -c 'import json, sys; [json.load(open(path)) for path in sys.argv[1:]]' "${json_files[@]}"
          fi
          if [ "${#yaml_files[@]}" -gt 0 ]; then
            ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path) }' "${yaml_files[@]}"
          fi
          echo "metadata syntax ok"

  unit_tests:
    name: 03 Granular Unit Tests
    runs-on: ubuntu-latest
    needs: schema
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        shell: bash
        run: |
          python -m compileall -q src tests examples scripts
      - name: Run Core, Diagnostics, and Safety tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests/unit -v

  multi_agent_and_advanced:
    name: 04 Multi-Agent and Advanced Tuning
    runs-on: ubuntu-latest
    needs: unit_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Multi-Agent, FinOps Arbiter, and Bayesian Search tests
        run: |
          PYTHONPATH=src python -m unittest tests/unit/agents/test_specialized_agents.py tests/unit/test_advanced_skills_extension.py -v

  benchmarks:
    name: 05 Benchmarks and A/B Scenarios
    runs-on: ubuntu-latest
    needs: multi_agent_and_advanced
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Multi-Technology A/B Benchmarks and Anti-Pattern Detection tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests/integration -v
          PYTHONPATH=src python -m unittest tests/unit/experimentation/test_multi_tech_benchmarks.py -v

  correctness_and_regression:
    name: 06 Correctness and Decision Gate
    runs-on: ubuntu-latest
    needs: benchmarks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require correctness contract
        shell: bash
        run: |
          grep -q "checksum" templates/BENCHMARK_TEMPLATE.md
          grep -q "correctness" templates/BENCHMARK_TEMPLATE.md
          grep -q "row_count" README.md
      - name: Require benchmark metrics
        shell: bash
        run: |
          for metric in duration shuffle spill gc cost; do
            grep -qi "$metric" templates/BENCHMARK_TEMPLATE.md
          done
      - name: Validate decision policy
        shell: bash
        run: |
          grep -q "accept" templates/DECISION_TEMPLATE.md
          grep -q "reject" templates/DECISION_TEMPLATE.md
          grep -q "inconclusive" templates/DECISION_TEMPLATE.md
          grep -q "correctness == true" docs/ci-validation-tree.md
      - name: Run End-to-End Loop Engine tests
        run: |
          PYTHONPATH=src python -m unittest tests/test_engine.py tests/test_event_log_runner.py -v
